<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <title>名真 Chat</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" href="./avatar.png" />

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Segoe UI", sans-serif;

        background: radial-gradient(circle at top, #2b2f55, #121426);

        color: white;

        height: 100vh;
        overflow: hidden;
      }

      /* 主畫面 */
      .main {
        display: flex;
        height: 100vh;
      }

      /* 左邊 */
      .left-panel {
        width: 45%;

        display: flex;
        justify-content: center;
        align-items: center;
      }

      /* 頭像區 */
      .avatar-wrap {
        position: relative;

        width: 320px;
        height: 320px;

        display: flex;
        justify-content: center;
        align-items: center;
      }

      /* 發光圈 */
      .glow-ring {
        position: absolute;

        inset: -18px;

        border-radius: 50%;

        border: 6px solid rgba(255, 255, 255, 0.8);

        box-shadow:
          0 0 20px rgba(255, 255, 255, 0.6),
          0 0 60px rgba(255, 255, 255, 0.3);

        opacity: 0.45;

        transition:
          transform 0.08s linear,
          opacity 0.08s linear,
          box-shadow 0.08s linear;
      }

      /* 主頭像 */
      .vtuber {
        width: 100%;
        height: 100%;

        object-fit: cover;

        border-radius: 50%;

        position: relative;
        z-index: 2;
      }

      /* 右側 */
      .right-panel {
        width: 55%;

        display: flex;
        flex-direction: column;
      }

      /* 聊天區 */
      .chat-area {
        flex: 1;

        overflow-y: auto;

        padding: 24px;
        padding-bottom: 130px;
      }

      /* 聊天列 */
      .chat-row {
        display: flex;

        gap: 10px;

        margin-bottom: 16px;
      }

      .chat-row.user {
        justify-content: flex-end;
      }

      .chat-row.bot {
        justify-content: flex-start;
      }

      /* 小頭像 */
      .avatar {
        width: 38px;
        height: 38px;

        border-radius: 50%;
      }

      /* 對話框 */
      .bubble {
        max-width: 70%;

        padding: 14px 18px;

        border-radius: 18px;

        line-height: 1.7;

        font-size: 16px;

        word-break: break-word;
      }

      /* 使用者 */
      .user .bubble {
        background: linear-gradient(135deg, #4f7cff, #7f8dff);

        color: white;
      }

      /* AI */
      .bot .bubble {
        background: rgba(255, 255, 255, 0.1);

        backdrop-filter: blur(10px);

        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      /* 輸入列 */
      .input-bar {
        position: fixed;

        left: 0;
        right: 0;
        bottom: 0;

        display: flex;

        gap: 12px;

        padding: 18px 22px;

        background: rgba(0, 0, 0, 0.4);

        backdrop-filter: blur(12px);

        z-index: 999;
      }

      /* 輸入框 */
      input {
        flex: 1;

        border: none;
        outline: none;

        border-radius: 14px;

        padding: 15px;

        font-size: 16px;

        background: rgba(255, 255, 255, 0.12);

        color: white;
      }

      input::placeholder {
        color: rgba(255, 255, 255, 0.5);
      }

      /* 按鈕 */
      button {
        border: none;

        border-radius: 14px;

        padding: 15px 20px;

        cursor: pointer;

        color: white;

        font-size: 16px;

        transition: 0.2s;
      }

      /* 送出 */
      .send-btn {
        background: linear-gradient(135deg, #6a7cff, #8b5dff);
      }

      @keyframes pulse {
        0% {
          transform: scale(1);
        }

        50% {
          transform: scale(1.08);
        }

        100% {
          transform: scale(1);
        }
      }

      /* 手機版 */
      @media (max-width: 768px) {
        .main {
          flex-direction: column;
        }

        .left-panel {
          width: 100%;
          height: 42vh;
        }

        .right-panel {
          width: 100%;
          height: 58vh;
        }

        .avatar-wrap {
          width: 220px;
          height: 220px;
        }

        .chat-area {
          padding: 16px;
          padding-bottom: 130px;
        }

        .bubble {
          max-width: 85%;

          font-size: 14px;
        }

        .input-bar {
          padding: 14px;
        }

        button {
          padding: 14px 16px;
        }
      }
    </style>
  </head>

  <body>
    <div class="main">
      <!-- 左側 -->
      <div class="left-panel">
        <div class="avatar-wrap">
          <!-- 發光圈 -->
          <div class="glow-ring" id="ring"></div>

          <!-- 頭像 -->
          <img id="vtuber" class="vtuber" src="./head.png" />
        </div>
      </div>

      <!-- 右側 -->
      <div class="right-panel">
        <div class="chat-area" id="chat"></div>
      </div>
    </div>

    <!-- 輸入列 -->
    <div class="input-bar">
      <input id="input" type="text" placeholder="跟名真說點什麼…" />

      <!-- 送出 -->
      <button class="send-btn" onclick="sendMessage()">送出</button>
    </div>

    <script>
      /* =========================
     基本設定
  ========================= */

      const WEBHOOK_URL = "https://mingzhenzhi6.app.n8n.cloud/webhook/vtuber";

      const OWNER_ID = "owner_001";

      const OWNER_NAME = "王祥斌";

      /* 發光圈 */
      const ring = document.getElementById("ring");

      /* =========================
     新增聊天
  ========================= */

      function addMessage(text, type) {
        const chat = document.getElementById("chat");

        const row = document.createElement("div");

        row.className = "chat-row " + type;

        const avatar = document.createElement("img");

        avatar.className = "avatar";

        avatar.src = type === "user" ? "./user-avatar.png" : "./avatar.png";

        const bubble = document.createElement("div");

        bubble.className = "bubble";

        bubble.innerText = text;

        if (type === "user") {
          row.appendChild(bubble);
          row.appendChild(avatar);
        } else {
          row.appendChild(avatar);
          row.appendChild(bubble);
        }

        chat.appendChild(row);

        chat.scrollTop = chat.scrollHeight;
      }

      /* =========================
     VTuber 發光動畫
  ========================= */

      function startTalking() {
        clearInterval(window.talkTimer);

        window.talkTimer = setInterval(() => {
          const level = 1 + Math.random() * 0.12;

          ring.style.transform = `scale(${level})`;

          ring.style.opacity = 0.7 + Math.random() * 0.3;

          ring.style.boxShadow = `
        0 0 25px rgba(255,255,255,.8),
        0 0 80px rgba(255,255,255,.5)
      `;
        }, 80);
      }

      function stopTalking() {
        clearInterval(window.talkTimer);

        ring.style.transform = "scale(1)";

        ring.style.opacity = ".45";

        ring.style.boxShadow = `
      0 0 20px rgba(255,255,255,.6),
      0 0 60px rgba(255,255,255,.3)
    `;
      }

      /* =========================
     發送訊息
  ========================= */

      async function sendMessage() {
        const input = document.getElementById("input");

        const text = input.value.trim();

        if (!text) return;

        addMessage(text, "user");

        input.value = "";

        try {
          const res = await fetch(WEBHOOK_URL, {
            method: "POST",

            headers: {
              "Content-Type": "application/json",
            },

            body: JSON.stringify({
              message: text,
              user_id: OWNER_ID,
              user_name: OWNER_NAME,
            }),
          });

          const data = await res.json();

          console.log("n8n回傳:", data);

          const reply = data.reply || "（沒有回應）";

          /* AI開始發光 */
          startTalking();

          /* 模擬AI思考一下 */
          setTimeout(() => {
            addMessage(reply, "bot");

            /* 幾秒後停止發光 */
            setTimeout(() => {
              stopTalking();
            }, 1800);
          }, 500);
        } catch (err) {
          console.error(err);

          addMessage("⚠️ 連線失敗", "bot");

          stopTalking();
        }
      }

      /* =========================
     Enter送出
  ========================= */

      document.getElementById("input").addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          sendMessage();
        }
      });
    </script>
  </body>
</html>
